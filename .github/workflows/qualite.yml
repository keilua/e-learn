name: Qualité

on:
  push:
    branches: [main, dev, feature]
  pull_request:
    branches: [main, dev, feature]

permissions:
  contents: read

jobs:
  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qualite:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : le build et les tests n'appellent pas le projet réel.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit des dépendances (high et critical bloquants)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rls:
    name: Tests base de données (RLS, fonctions, stockage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Démarrer Supabase (migrations appliquées depuis zéro)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,postgres-meta,supavisor
      - name: Tests pgTAP
        run: supabase test db
